    <line class="slot-line" x1="905" y1="610" x2="960" y2="560"/><circle class="slot-frost" cx="890" cy="625" r="18"/><text class="micro" x="878" y="631">16</text>
    <line class="slot-line" x1="1160" y1="615" x2="1180" y2="560"/><circle class="slot-frost" cx="1155" cy="635" r="18"/><text class="micro" x="1143" y="641">17</text>
    <line class="slot-line" x1="1260" y1="615" x2="1185" y2="545"/><circle class="slot-frost" cx="1275" cy="630" r="18"/><text class="micro" x="1263" y="636">18</text>
  </g>

  <g>
    <line class="slot-line" x1="1130" y1="280" x2="1170" y2="325"/><circle class="slot-final" cx="1115" cy="265" r="18"/><text class="micro" x="1103" y="271">19</text>
    <line class="slot-line" x1="1130" y1="390" x2="1170" y2="340"/><circle class="slot-final" cx="1115" cy="405" r="18"/><text class="micro" x="1103" y="411">20</text>
    <line class="slot-line" x1="1225" y1="245" x2="1265" y2="280"/><circle class="slot-final" cx="1210" cy="230" r="18"/><text class="micro" x="1198" y="236">21</text>
    <line class="slot-line" x1="1225" y1="425" x2="1265" y2="390"/><circle class="slot-final" cx="1210" cy="440" r="18"/><text class="micro" x="1198" y="446">22</text>
    <line class="slot-line" x1="1420" y1="245" x2="1390" y2="280"/><circle class="slot-final" cx="1435" cy="230" r="18"/><text class="micro" x="1423" y="236">23</text>
    <line class="slot-line" x1="1420" y1="425" x2="1390" y2="390"/><circle class="slot-final" cx="1435" cy="440" r="18"/><text class="micro" x="1423" y="446">24</text>
  </g>

  <g>
    <rect class="legend-box" x="82" y="770" width="620" height="140"/>
    <text class="label" x="106" y="810">LEGEND</text>
    <circle class="slot-early" cx="115" cy="845" r="14"/><text class="small" x="145" y="852">Early lane: Archer / Dart Thrower</text>
    <circle class="slot-shock" cx="115" cy="885" r="14"/><text class="small" x="145" y="892">Mid pressure: Shock Relay</text>
    <circle class="slot-range" cx="430" cy="845" r="14"/><text class="small" x="460" y="852">High range: Crossbow / Drill</text>
    <circle class="slot-frost" cx="430" cy="885" r="14"/><text class="small" x="460" y="892">Control: Frost Totem</text>
    <circle class="slot-final" cx="645" cy="845" r="14"/><text class="small" x="675" y="852">Final ring: heavy defense</text>
  </g>

  <g>
    <rect class="legend-box" x="1105" y="730" width="355" height="180"/>
    <text class="label" x="1130" y="770">INTENDED FLOW</text>
    <text class="small" x="1130" y="812">1. Thin early trash on slots 1-6</text>
    <text class="small" x="1130" y="846">2. Shock chain in the middle bends</text>
    <text class="small" x="1130" y="880">3. Frost slows before the keep gate</text>
    <text class="small" x="1130" y="914">4. Final ring protects the core</text>
