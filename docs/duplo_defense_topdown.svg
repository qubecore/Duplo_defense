    <line class="slot-line" x1="170" y1="190" x2="170" y2="230"/><circle class="slot-early" cx="170" cy="180" r="18"/><text class="micro" x="162" y="186">1</text>
    <line class="slot-line" x1="255" y1="190" x2="255" y2="230"/><circle class="slot-early" cx="255" cy="180" r="18"/><text class="micro" x="247" y="186">2</text>
    <line class="slot-line" x1="255" y1="350" x2="255" y2="310"/><circle class="slot-early" cx="255" cy="360" r="18"/><text class="micro" x="247" y="366">3</text>
    <line class="slot-line" x1="430" y1="210" x2="390" y2="250"/><circle class="slot-early" cx="440" cy="200" r="18"/><text class="micro" x="432" y="206">4</text>
    <line class="slot-line" x1="430" y1="520" x2="390" y2="480"/><circle class="slot-early" cx="440" cy="530" r="18"/><text class="micro" x="432" y="536">5</text>
    <line class="slot-line" x1="560" y1="520" x2="590" y2="480"/><circle class="slot-early" cx="550" cy="530" r="18"/><text class="micro" x="542" y="536">6</text>
  </g>

  <g>
    <line class="slot-line" x1="735" y1="385" x2="700" y2="430"/><circle class="slot-shock" cx="745" cy="375" r="18"/><text class="micro" x="737" y="381">7</text>
    <line class="slot-line" x1="800" y1="325" x2="760" y2="360"/><circle class="slot-shock" cx="810" cy="315" r="18"/><text class="micro" x="802" y="321">8</text>
    <line class="slot-line" x1="725" y1="95" x2="685" y2="140"/><circle class="slot-shock" cx="735" cy="85" r="18"/><text class="micro" x="727" y="91">9</text>
    <line class="slot-line" x1="845" y1="95" x2="805" y2="140"/><circle class="slot-shock" cx="855" cy="85" r="18"/><text class="micro" x="843" y="91">10</text>
  </g>

  <g>
    <line class="slot-line" x1="610" y1="110" x2="645" y2="155"/><circle class="slot-range" cx="600" cy="100" r="18"/><text class="micro" x="588" y="106">11</text>
    <line class="slot-line" x1="1005" y1="105" x2="980" y2="150"/><circle class="slot-range" cx="1015" cy="95" r="18"/><text class="micro" x="1003" y="101">12</text>
    <line class="slot-line" x1="1080" y1="255" x2="1015" y2="190"/><circle class="slot-range" cx="1095" cy="270" r="18"/><text class="micro" x="1083" y="276">13</text>
    <line class="slot-line" x1="1080" y1="625" x2="1015" y2="560"/><circle class="slot-range" cx="1095" cy="640" r="18"/><text class="micro" x="1083" y="646">14</text>
  </g>

  <g>
