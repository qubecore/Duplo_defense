<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #0f1724; }
      .frame { fill: #132238; stroke: #2f4a69; stroke-width: 8; rx: 24; }
      .grid { stroke: #1b2d45; stroke-width: 1; opacity: 0.65; }
      .path { fill: none; stroke: #d6b47d; stroke-width: 72; stroke-linecap: round; stroke-linejoin: round; }
      .path-outline { fill: none; stroke: #6a5432; stroke-width: 84; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
      .keep { fill: #294d33; stroke: #7cc56e; stroke-width: 5; rx: 22; }
      .core { fill: #86f08d; fill-opacity: 0.15; stroke: #b8ff8d; stroke-width: 4; rx: 16; }
      .slot-line { stroke: #8ea0b8; stroke-width: 2; }
      .slot-early { fill: #69d17a; stroke: #e8fff0; stroke-width: 3; }
      .slot-shock { fill: #f3cf4e; stroke: #fff6c7; stroke-width: 3; }
      .slot-range { fill: #71aaf7; stroke: #e6f2ff; stroke-width: 3; }
      .slot-frost { fill: #77e8ff; stroke: #e2fbff; stroke-width: 3; }
      .slot-final { fill: #ff8f7c; stroke: #ffe1da; stroke-width: 3; }
      .spawn { fill: #ff6b6b; stroke: #ffd4d4; stroke-width: 4; }
      .operator { fill: #b89cff; stroke: #efe5ff; stroke-width: 3; }
      .label { fill: #e9f0f7; font-family: Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #b5c6da; font-family: Segoe UI, Arial, sans-serif; font-size: 18px; }
      .micro { fill: #dfe9f4; font-family: Consolas, monospace; font-size: 16px; font-weight: 700; }
      .legend-box { fill: #102033; stroke: #38577a; stroke-width: 3; rx: 18; }
      .zone { fill: #e8f1ff; font-family: Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; opacity: 0.9; }
      .arrow { fill: #ffe6ae; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect class="frame" x="48" y="48" width="1504" height="904"/>

  <g opacity="0.9">
    <path class="grid" d="M120 80V920 M220 80V920 M320 80V920 M420 80V920 M520 80V920 M620 80V920 M720 80V920 M820 80V920 M920 80V920 M1020 80V920 M1120 80V920 M1220 80V920 M1320 80V920 M1420 80V920"/>
    <path class="grid" d="M80 140H1520 M80 240H1520 M80 340H1520 M80 440H1520 M80 540H1520 M80 640H1520 M80 740H1520 M80 840H1520"/>
  </g>

  <text class="label" x="92" y="104">DUPLO DEFENSE - IDEAL TOP VIEW</text>
  <text class="small" x="92" y="132">One main route, 3 kill zones, 24 tower slots, final ring around the Duplo core</text>

  <rect class="keep" x="1140" y="150" width="320" height="500"/>
  <text class="label" x="1210" y="190">DUPLO KEEP</text>
  <rect class="core" x="1260" y="250" width="140" height="150"/>
  <text class="label" x="1280" y="320">CORE</text>
  <text class="small" x="1210" y="610">Final defense court</text>

  <path class="path-outline" d="M125 270 L360 270 L360 460 L660 460 L660 170 L980 170 L980 540 L1180 540 L1180 330 L1300 330 L1300 315"/>
  <path class="path" d="M125 270 L360 270 L360 460 L660 460 L660 170 L980 170 L980 540 L1180 540 L1180 330 L1300 330 L1300 315"/>

  <polygon class="arrow" points="130,270 95,250 95,290"/>
  <polygon class="arrow" points="360,460 340,495 380,495"/>
  <polygon class="arrow" points="660,170 640,135 680,135"/>
  <polygon class="arrow" points="980,540 960,575 1000,575"/>
  <polygon class="arrow" points="1300,315 1335,315 1315,280"/>

  <circle class="spawn" cx="125" cy="270" r="22"/>
  <text class="label" x="74" y="226">SPAWN</text>
  <text class="small" x="66" y="250">zombies enter</text>

  <circle class="operator" cx="1215" cy="705" r="18"/>
  <text class="small" x="1245" y="712">operator / match npc</text>

  <text class="zone" x="210" y="205">KILL ZONE A</text>
  <text class="zone" x="585" y="395">KILL ZONE B</text>
  <text class="zone" x="1030" y="485">KILL ZONE C</text>
  <text class="zone" x="1175" y="445">FINAL RING</text>

