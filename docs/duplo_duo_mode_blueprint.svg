  <g>
    <rect class="legend" x="84" y="968" width="1038" height="78" rx="16"/>
    <text class="note" x="108" y="996">Shards stay shared for the whole team, same progression rules as solo. Super towers are fully shared: both players can buy, use, upgrade, or sell them.</text>
    <text class="note" x="108" y="1018">Traps are now split 4/4: BT1-BT4 belong to Blue player, GT1-GT4 belong to Green player. One chest open rewards both players. Disconnect = automatic defeat.</text>
  </g>

  <g>
    <rect class="legend" x="1128" y="128" width="530" height="162" rx="18"/>
    <text class="text" x="1156" y="168">BOSS LOGIC FIT</text>
    <text class="small" x="1156" y="204">Rift Twins work on the first split and the second split without confusing the final shared lane.</text>
    <text class="small" x="1156" y="232">Node Arbiter can side-swap on the second split, then become a forward respawn boss once it enters the final lane.</text>
    <text class="small" x="1156" y="260">Seal Master can disable one colored branch while the ally answers from the opposite branch.</text>
