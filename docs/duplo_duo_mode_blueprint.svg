  <text class="title" x="84" y="100">DUPLO TD - DUO MODE BLUEPRINT</text>
  <text class="subtitle" x="84" y="130">Locked to the approved flow: blue/green start lanes, one shared lane, split again into two lanes, then one final merged lane into the Hollow.</text>

